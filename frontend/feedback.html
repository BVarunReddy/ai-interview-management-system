<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback — InterviewPro</title>
    <link rel="stylesheet" href="css/app.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
  </head>
  <body>
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
      <div class="navbar" id="navbar"></div>
      <div class="page-content">
        <div class="page-header">
          <h1>Interview Feedback</h1>
          <p>Evaluate candidate performance and submit hiring recommendation</p>
        </div>
        <div class="dash-grid">
          <div class="card">
            <div class="card-header">
              <div>
                <div class="card-title">Evaluation Form</div>
                <div class="card-subtitle">
                  Score the candidate across key dimensions
                </div>
              </div>
            </div>
            <form id="feedbackForm">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label"
                    >Candidate <span class="req">*</span></label
                  >
                  <select id="candidate_id" class="form-control" required>
                    <option value="">— Select candidate —</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label"
                    >Recommendation <span class="req">*</span></label
                  >
                  <select id="recommendation" class="form-control">
                    <option value="Strong Hire">⭐ Strong Hire</option>
                    <option value="Hire" selected>✅ Hire</option>
                    <option value="Maybe">🤔 Maybe</option>
                    <option value="No Hire">❌ No Hire</option>
                  </select>
                </div>
              </div>

              <!-- Score Sliders -->
              <div
                style="
                  background: #f8fafc;
                  border-radius: 12px;
                  padding: 20px;
                  margin-bottom: 20px;
                "
              >
                <p
                  style="
                    font-size: 13px;
                    font-weight: 600;
                    margin-bottom: 16px;
                    color: #475569;
                  "
                >
                  SCORES (1 = Poor, 10 = Excellent)
                </p>
                <div class="score-group">
                  <div class="score-header">
                    <label>Technical Skills</label>
                    <div class="score-val" id="techVal">5</div>
                  </div>
                  <input
                    type="range"
                    id="technical"
                    min="1"
                    max="10"
                    value="5"
                    oninput="
                      document.getElementById('techVal').textContent =
                        this.value
                    "
                  />
                </div>
                <div class="score-group">
                  <div class="score-header">
                    <label>Communication</label>
                    <div class="score-val" id="commVal">5</div>
                  </div>
                  <input
                    type="range"
                    id="communication"
                    min="1"
                    max="10"
                    value="5"
                    oninput="
                      document.getElementById('commVal').textContent =
                        this.value
                    "
                  />
                </div>
                <div class="score-group">
                  <div class="score-header">
                    <label>Problem Solving</label>
                    <div class="score-val" id="probVal">5</div>
                  </div>
                  <input
                    type="range"
                    id="problem_solving"
                    min="1"
                    max="10"
                    value="5"
                    oninput="
                      document.getElementById('probVal').textContent =
                        this.value
                    "
                  />
                </div>
                <!-- Overall score display -->
                <div
                  style="
                    text-align: center;
                    margin-top: 16px;
                    padding: 12px;
                    background: white;
                    border-radius: 10px;
                    border: 1px solid #e2e8f0;
                  "
                >
                  <div
                    style="
                      font-size: 12px;
                      color: #64748b;
                      font-weight: 600;
                      margin-bottom: 4px;
                    "
                  >
                    OVERALL SCORE
                  </div>
                  <div
                    id="overallScore"
                    style="
                      font-family: &quot;Syne&quot;, sans-serif;
                      font-size: 28px;
                      font-weight: 800;
                      color: #4f46e5;
                    "
                  >
                    5.0
                  </div>
                  <div style="font-size: 11px; color: #94a3b8">/ 10</div>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">HR Remarks</label>
                <textarea
                  id="remarks"
                  class="form-control"
                  rows="5"
                  placeholder="Write detailed observations about the candidate's performance, attitude, culture fit, and any concerns..."
                ></textarea>
              </div>

              <button type="submit" class="btn btn-primary" id="submitBtn">
                <i class="fa fa-paper-plane"></i> Submit Feedback
              </button>
            </form>
          </div>

          <div>
            <div class="insight-card">
              <h4>
                <i
                  class="fa fa-poll"
                  style="color: #4f46e5; margin-right: 8px"
                ></i
                >Average Scores
              </h4>
              <div class="insight-row">
                <span>Technical</span><strong id="avgTech">—</strong>
              </div>
              <div class="insight-row">
                <span>Communication</span><strong id="avgComm">—</strong>
              </div>
              <div class="insight-row">
                <span>Problem Solving</span><strong id="avgProb">—</strong>
              </div>
              <div class="insight-row">
                <span>Overall</span><strong id="avgOverall">—</strong>
              </div>
            </div>

            <div class="insight-card">
              <h4>Recent Feedback</h4>
              <div id="recentFeedback">
                <div class="skeleton skeleton-text mb-2"></div>
                <div class="skeleton skeleton-text mb-2"></div>
                <div class="skeleton skeleton-text"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/feedback.js"></script>
  </body>
</html>
